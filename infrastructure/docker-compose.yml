services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["databases"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ATLAS_DevOnly_StrongPassword!42"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  postgres:
    image: postgres:16-alpine
    profiles: ["databases"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    ports:
      - "6379:6379"

  control-plane:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.control-plane
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      ATLAS_MODE: demo
      ATLAS_REQUIRE_AUTH: "false"
      ATLAS_ALLOWED_ORIGINS: http://localhost:4173,http://localhost:8081
    profiles: ["control-plane", "console"]

  web-console:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.web-console
      args:
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "8081:80"
    depends_on:
      - control-plane
    profiles: ["console"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    profiles: ["observability"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
    profiles: ["observability"]

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    profiles: ["observability"]

volumes:
  sqlserver-data:
  postgres-data:
