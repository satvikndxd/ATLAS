services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["databases"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "ATLAS_DevOnly_StrongPassword!42"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  postgres:
    image: postgres:16-alpine
    profiles: ["databases"]
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas_dev_only
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    profiles: ["queue"]
    ports:
      - "6379:6379"

  control-plane:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile.control-plane
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
    profiles: ["control-plane"]

volumes:
  sqlserver-data:
  postgres-data:
