[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-migration-fabric"
version = "0.1.0"
description = "Evidence-first data migration, verification, recovery, CDC, and cutover fabric"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0", "hypothesis>=6.0"]
live-db = ["pyodbc>=5.1", "psycopg[binary]>=3.2"]

[project.scripts]
atlas = "apps.cli.atlas_cli:main"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["atlas_core*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
markers = [
  "integration: disposable persistence integration tests",
  "live_db: tests requiring a configured SQL Server or PostgreSQL instance",
  "stress: long-running performance tests",
  "security: authorization and secret-handling tests",
]

[tool.ruff]
line-length = 100

target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
