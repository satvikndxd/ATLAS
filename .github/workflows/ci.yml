name: ATLAS CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-fast:
    name: Python reference and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[test]'
      - run: python -m compileall -q atlas_core apps tests
      - run: python -m pytest -q
      - run: python -m apps.cli.atlas_cli demo --seed 42 --customers 10 --batch-size 5 --state-dir /tmp/atlas-ci-demo

  rust:
    name: Rust test, format, and clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/fingerprint
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: 1.75.0
          components: rustfmt, clippy
      - run: cargo test --locked
      - run: cargo fmt --check
      - run: cargo clippy --locked -- -D warnings

  dotnet:
    name: .NET control plane and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore apps/control-plane-dotnet/Atlas.ControlPlane.csproj
      - run: dotnet build apps/control-plane-dotnet/Atlas.ControlPlane.csproj --no-restore --configuration Release
      - run: dotnet test apps/control-plane-dotnet.Tests/Atlas.ControlPlane.Tests.csproj --configuration Release

  frontend:
    name: React TypeScript build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: pnpm
          cache-dependency-path: apps/web-console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  contract-fast:
    name: Cross-language contract and API smoke tests
    runs-on: ubuntu-latest
    needs: [python-fast, rust, dotnet, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest tests/connectors -q
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build apps/control-plane-dotnet/Atlas.ControlPlane.csproj --configuration Release
      - run: |
          nohup dotnet run --project apps/control-plane-dotnet --no-build --configuration Release --urls http://127.0.0.1:8080 > /tmp/atlas-api.log 2>&1 &
          sleep 3
          curl --fail-with-body http://127.0.0.1:8080/api/v1/health
          curl --fail-with-body -X POST http://127.0.0.1:8080/api/v1/migrations -H 'Content-Type: application/json' -d '{"migration_id":"ci-001","source":"legacy","target":"modern"}'
          curl --fail-with-body http://127.0.0.1:8080/api/v1/migrations/ci-001

  live-db:
    name: Live database integration (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: echo 'SKIPPED — requires live SQL Server/PostgreSQL connector fixtures and vendor drivers'
